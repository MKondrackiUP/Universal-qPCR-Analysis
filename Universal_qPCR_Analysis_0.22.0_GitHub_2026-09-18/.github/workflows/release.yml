name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify application and scientific oracle
        run: npm run verify

      - name: Verify repository checksums
        run: npm run checksums:verify

      - name: Check that the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          expected=$(node -p "require('./package.json').version")
          echo "tag=${tag} package.json=${expected}"
          test "${tag}" = "${expected}"

      - name: Refuse to publish unresolved metadata
        run: |
          # A release is what Zenodo archives and what readers cite, so the
          # citation placeholders must be filled in before it is created.
          if grep -rn "REPLACE_BEFORE_PUBLICATION" CITATION.cff docs/CITATION.cff; then
            echo "citation metadata still contains placeholders"
            exit 1
          fi

      - name: Build the source archive
        run: |
          name="universal-qpcr-analysis-${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="${name}/" -o "${name}.tar.gz" HEAD
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            universal-qpcr-analysis-*.tar.gz
            universal-qpcr-analysis-*.tar.gz.sha256
            SHA256SUMS.txt
          body_path: CHANGELOG.md
          draft: true
